# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale encoding
# (cp950 on Traditional Chinese Windows), so non-ASCII characters break parsing.
#
# sqlalchemy.url is intentionally NOT set: the connection always comes from the
# application settings (DATABASE_URL), so no connection string or password is
# ever written to a file under version control.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
